spring.datasource.url=jdbc:h2:file:./data/doughlycrumbl-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.security.oauth2.client.registration.google.client-id=local-google-client-id
spring.security.oauth2.client.registration.google.client-secret=local-google-client-secret

app.jwt.secret=local-dev-secret-key-requires-at-least-256-bits-for-jjwt
app.oauth2.redirect-uri=http://localhost:5173/oauth/callback

app.upload.dir=uploads
app.upload.base-url=http://localhost:8080/api/uploads

app.paymongo.secret-key=sk_test_local_placeholder
app.paymongo.public-key=pk_test_local_placeholder
