spring.application.name=doughlycrumbl
spring.config.import=optional:file:.env[.properties]

# ========== Database (Supabase) ==========
# Local dev: set DB_URL / DB_USERNAME / DB_PASSWORD in .env
# Render:    set SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#            Spring Boot relaxed-binding maps SPRING_DATASOURCE_* -> spring.datasource.* automatically,
#            so those Render env vars override the ${DB_URL:...} placeholders below.
# IMPORTANT: SPRING_DATASOURCE_URL on Render MUST start with jdbc:postgresql://
#            (Supabase gives postgresql:// — add the jdbc: prefix yourself)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/doughlycrumbl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — keep connections well below Supabase free-tier session-mode cap of 15
# On Render set SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3 and
#               SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1  (or leave defaults)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ========== JPA / Hibernate ==========
# validate: confirms the schema matches entities on startup — no DDL is executed.
# Use none only if you want Hibernate completely hands-off.
# Never use update in production (causes the DEFAULT syntax crash on Supabase).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== JWT ==========
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-use}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========== Server ==========
server.port=${SERVER_PORT:8080}

# ========== Google OAuth2 ==========
# OAuth2/Google login is not yet implemented. These properties are intentionally
# absent to prevent Spring Boot from auto-configuring an OAuth2 client with empty credentials.
# Re-add them only when Google login is actually wired up.

# ========== SMTP Email (Gmail) ==========
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

# ========== File Upload ==========
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080/api/uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}

# ========== PayMongo ==========
# Get keys from https://dashboard.paymongo.com/developers
app.paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
app.paymongo.public-key=${PAYMONGO_PUBLIC_KEY:}
