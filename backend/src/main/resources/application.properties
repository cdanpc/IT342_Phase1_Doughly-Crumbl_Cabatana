spring.application.name=doughlycrumbl
spring.config.import=optional:file:.env[.properties]

# ========== Database (Supabase) ==========
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/doughlycrumbl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== JWT ==========
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-use}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========== Server ==========
server.port=${SERVER_PORT:8080}

# ========== Google OAuth2 ==========
# OAuth2/Google login is not yet implemented. These properties are intentionally
# absent to prevent Spring Boot from auto-configuring an OAuth2 client with empty credentials.
# Re-add them only when Google login is actually wired up.

# ========== SMTP Email (Gmail) ==========
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

# ========== File Upload ==========
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080/api/uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}

# ========== PayMongo ==========
# Get keys from https://dashboard.paymongo.com/developers
app.paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
app.paymongo.public-key=${PAYMONGO_PUBLIC_KEY:}
